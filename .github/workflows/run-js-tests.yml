name: Run JS Tests

on:
  push:
    paths:
      - 'resources/js/**'
      - 'resources/css/**'
      - 'resources/dist/**'
      - 'tests/js/**'
      - 'bin/build.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'
      - '.github/workflows/run-js-tests.yml'
  pull_request:
    paths:
      - 'resources/js/**'
      - 'resources/css/**'
      - 'resources/dist/**'
      - 'tests/js/**'
      - 'bin/build.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'
      - '.github/workflows/run-js-tests.yml'

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

      - name: Check the committed build is up to date
        run: |
          npm run build
          if ! git diff --exit-code --stat resources/dist; then
            echo "::error::resources/dist is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
